name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck (main / ui / test)
        run: npm run typecheck

      - name: Lint (включая границы main <-> ui)
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Tests
        run: npm run test

      # Собирает UI и code.js, затем валит сборку при выходе за бюджет 500 KB.
      - name: Build + size budget
        run: npm run build
